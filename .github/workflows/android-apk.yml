name: Android APK

# Construction réelle de l'APK A.MS (Capacitor → Gradle).
# - Débogage : toujours, sur chaque push/PR pertinent.
# - Release signée : déclenchement manuel UNIQUEMENT si
#   les secrets de signature sont configurés (jamais de
#   clé privée dans le dépôt).

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------- APK de débogage (installable) ----------------
  debug-apk:
    name: APK de débogage — A-MS-debug.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build web
        run: npm run build

      - name: Synchroniser Capacitor (Android)
        run: npx cap sync android

      - name: Construire l'APK de débogage
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log || {
            echo "### Erreur de compilation Gradle" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 /tmp/gradle_build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Debug inspect build outputs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_FILES=$(find android/app/build -maxdepth 6 -type f 2>/dev/null | head -n 50 || echo "aucun fichier")
          gh pr comment 2 --body "### Fichiers build :
          \`\`\`
          $BUILD_FILES
          \`\`\`" || true

      - name: Vérifier et nommer l'APK
        run: |
          APK_FOUND=$(find android -name "*.apk" -type f | grep -i "debug" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find android -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FOUND" ] || [ ! -s "$APK_FOUND" ]; then
            echo "::error::Aucun fichier .apk valide trouvé dans android/"
            echo "### Fichiers produits dans android/app/build :" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            find android/app/build -maxdepth 5 -ls >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "APK localisé avec succès : $APK_FOUND"
          cp "$APK_FOUND" A-MS-debug.apk

      - name: Publier l'APK de débogage
        uses: actions/upload-artifact@v4
        with:
          name: A-MS-debug
          path: A-MS-debug.apk
          if-no-files-found: error

  # ---------------- APK release signé (manuel, optionnel) ----------------
  release-apk:
    name: APK release signé (optionnel)
    if: github.event_name == 'workflow_dispatch'
    needs: debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Synchroniser Capacitor (Android)
        run: npx cap sync android

      - name: Importer la clé de signature (secret, jamais dans le dépôt)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AMS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "keystore_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun secret AMS_KEYSTORE_BASE64 — APK release non construit. Le débogage reste disponible."
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "keystore_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l'APK release signé
        if: steps.keystore.outputs.keystore_available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AMS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMS_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon \
          -PkeystorePath=../release.keystore \
          -PkeystorePassword="$KEYSTORE_PASSWORD" \
          -PkeyAlias="$KEY_ALIAS" \
          -PkeyPassword="$KEY_PASSWORD"

      - name: Vérifier et nommer l'APK release
        if: steps.keystore.outputs.keystore_available == 'true'
        run: |
          APK_PATH=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::L'APK release n'a pas été produit à $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" A-MS-release.apk

      - name: Publier l'APK release
        if: steps.keystore.outputs.keystore_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: A-MS-release
          path: A-MS-release.apk
          if-no-files-found: error
