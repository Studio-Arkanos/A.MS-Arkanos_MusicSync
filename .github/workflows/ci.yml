name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  # ----- Application web (React/TS) -----
  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build web
        run: npm run build

  # ----- Application Android (Kotlin / Room / Capacitor) -----
  android:
    name: Android — assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Synchroniser Capacitor (Android)
        run: npx cap sync android

      - name: Construire l'APK de débogage
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log || {
            echo "### Erreur de compilation Gradle" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 /tmp/gradle_build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ams-debug-apk
          path: android/**/outputs/**/*.apk
